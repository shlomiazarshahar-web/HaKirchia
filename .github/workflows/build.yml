name: בנייה לווינדוס

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: בדיקות
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tools for checking the Word files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer-nogui python3-docx > /dev/null
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: בניית קובץ התקנה
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the version number
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the Windows app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload for trying (from the Actions page)
        # The Actions storage of a private repository is small; when it is full the test release
        # below still has the files, so a full storage does not fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: HaKirchia-Windows
          path: |
            dist/HaKirchia-Setup-*.exe
          retention-days: 5
      - name: Test version of a pull request (a pre-release on the Releases page, replaced on every push)
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-pr-${{ github.event.pull_request.number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "לבדיקה: ${{ github.event.pull_request.title }}"
          body: |
            גרסת בדיקה של בקשת השינוי #${{ github.event.pull_request.number }}, לפני מיזוג. מתעדכנת בכל שינוי.
            להורדה: HaKirchia-Setup (התקנה רגילה) או HaKirchia-Portable (בלי התקנה).
          files: dist/*.exe
          prerelease: true
          make_latest: false
      - name: Publish a release (only after merging to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: הכריכייה, גרסה ${{ steps.ver.outputs.version }}
          body: |
            **להתקנה:** מורידים את HaKirchia-Setup-${{ steps.ver.outputs.version }}.exe ומפעילים. ההתקנה שואלת לאן להתקין, יוצרת קיצור דרך בשולחן העבודה ובתפריט התחל, ואפשר להסיר אותה מ"אפליקציות" בהגדרות Windows.
            התקנה מעל גרסה קודמת מעדכנת אותה; הספרים וההגדרות נשארים.
            **בלי התקנה:** HaKirchia-Portable-${{ steps.ver.outputs.version }}.exe, פשוט להפעיל.
            Windows עשוי להציג אזהרה "Windows protected your PC": לוחצים "More info" ואז "Run anyway".
          files: dist/*.exe
          make_latest: true
