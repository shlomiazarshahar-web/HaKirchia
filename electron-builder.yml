appId: com.hakirchia.app
productName: HaKirchia
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - build/icon.png
  - package.json
asar: true
copyright: '© 2026 הכריכייה'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: HaKirchia-${version}-${arch}.${ext}
# The installer (version 1.0): Hebrew, with the logo, asks where to install and for whom,
# puts shortcuts on the desktop and in the Start menu, and adds a normal uninstaller to
# Windows "Apps". Uninstalling never touches the books (they live in the writer's own folders)
# and keeps the app's settings, so installing again brings back the bookshelf.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages: [he_IL]
  language: '1037'
  multiLanguageInstaller: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: false
  shortcutName: הכריכייה
  uninstallDisplayName: הכריכייה ${version}
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: HaKirchia-Setup-${version}.${ext}
# Auto-update (version 1.1): the installed app looks for new versions on this repository's
# Releases page (the repository is public). The build writes latest.yml next to the installer;
# the workflow uploads both, and the app reads latest.yml to learn the newest version.
publish:
  provider: github
  owner: shlomiazarshahar-web
  repo: HaKirchia
  releaseType: release
portable:
  artifactName: HaKirchia-Portable-${version}.${ext}
